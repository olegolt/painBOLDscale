[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "painpred"
version = "1.0.0"
description = "Pain-evoked neural activity scales with subjective pain across individuals: analysis and figures"
requires-python = ">=3.10"
dependencies = [
    "numpy", "scipy", "pandas", "scikit-learn", "matplotlib", "nibabel", "nilearn", "SUITPy", "joblib", "tqdm",
]

[project.optional-dependencies]
registration = ["antspyx"]  # only for rebuilding the Hoeppli mask

[tool.setuptools.packages.find]
include = ["painpred*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 165
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E741", "B905", "B008", "SIM108", "E731"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["I", "F841", "E501", "S102", "E402", "E401", "E701", "E702", "SIM", "B"]
